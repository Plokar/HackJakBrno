# PRODUCTION docker-compose
# Pro development použij: docker-compose -f docker-compose.dev.yml up

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    # Nepublikujeme port ven v produkci

  redis:
    image: redis:7-alpine
    container_name: medichub_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: >
      bash -c "
      echo 'Starting Django application...' &&
      echo 'Waiting for PostgreSQL...' &&
      while ! nc -z db 5432; do sleep 0.1; done &&
      echo 'PostgreSQL started' &&
      echo 'Running database migrations...' &&
      python manage.py migrate --noinput &&
      echo 'Collecting static files...' &&
      python manage.py collectstatic --noinput &&
      echo 'Initializing operating rooms...' &&
      python manage.py init_operating_rooms --count 10 || echo 'Warning: Could not initialize operating rooms' &&
      echo 'Initializing doctors...' &&
      python manage.py init_doctors || echo 'Warning: Could not initialize doctors' &&
      echo 'Starting production server with Gunicorn...' &&
      gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 4 --threads 2 --timeout 60 --access-logfile - --error-logfile - --log-level info
      "
    container_name: medichub_backend
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings_prod
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - app-network
      - korex_space_korex_network  # Připojení do KOREX nginx sítě
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_started
      fhir-server:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: medichub_frontend
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    networks:
      - app-network
      - korex_space_korex_network  # Připojení do KOREX nginx sítě
    depends_on:
      - backend
    restart: unless-stopped

  fhir-server:
    build:
      context: ./iris-fhir-template-master
      dockerfile: Dockerfile
    container_name: medichub_fhir
    restart: unless-stopped
    ports:
      - "32782:1972"
      - "32783:52773"
      - "32784:53773"
    volumes:
      - ./iris-fhir-template-master/data:/data
      - ./iris-fhir-template-master/fhirUI:/usr/irissys/csp/fhirUI
    environment:
      - IRIS_PASSWORD=SYS
      - IRIS_USERNAME=SuperUser
    networks:
      - app-network
      - korex_space_korex_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:52773/fhir/r4/metadata || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    command:
      - -a
      - iris session iris -U%SYS '##class(Security.Users).UnExpireUserPasswords("*")'
      - --check-caps false

volumes:
  postgres_data:
  fhir_data:
  redis_data:

networks:
  app-network:
    driver: bridge
  korex_space_korex_network:
    external: true  # Externí síť z KOREX_Space
