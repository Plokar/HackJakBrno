# PRODUCTION docker-compose
# Pro development použij: docker-compose -f docker-compose.dev.yml up

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    # Nepublikujeme port ven v produkci

  redis:
    image: redis:7-alpine
    container_name: medichub_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: bash -c "./entrypoint.sh"
    container_name: medichub_backend
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings_prod
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - app-network
      - korex_space_korex_network  # Připojení do KOREX nginx sítě
    depends_on:
      - db
      - redis
      - fhir-server
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medichub_frontend
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - app-network
      - korex_space_korex_network  # Připojení do KOREX nginx sítě
    depends_on:
      - backend
    restart: unless-stopped

  fhir-server:
    image: intersystemsdc/irishealth-community:latest
    container_name: medichub_fhir
    restart: unless-stopped
    ports:
      - "32782:1972"
      - "32783:52773"
      - "32784:53773"
    volumes:
      - fhir_data:/usr/irissys/mgr
      - ./iris-fhir-template-master/data/fhir:/data/fhir
      - ./iris-fhir-template-master/src:/irisdev/app/src
      - ./iris-fhir-template-master/iris.script:/irisdev/app/iris.script
      - ./iris-fhir-template-master/module.xml:/irisdev/app/module.xml
    environment:
      - IRIS_PASSWORD=SYS
      - IRIS_USERNAME=SuperUser
    networks:
      - app-network
      - korex_space_korex_network
    command: 
      - --check-caps false

volumes:
  postgres_data:
  fhir_data:
  redis_data:

networks:
  app-network:
    driver: bridge
  korex_space_korex_network:
    external: true  # Externí síť z KOREX_Space
