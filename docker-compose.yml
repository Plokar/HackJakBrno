# PRODUCTION docker-compose
# Pro development použij: docker-compose -f docker-compose.dev.yml up

services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apppassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    # Nepublikujeme port ven v produkci

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    command: bash -c "./entrypoint.sh"
    container_name: medichub_backend
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings_prod
    networks:
      - app-network
      - korex_space_korex_network  # Připojení do KOREX nginx sítě
    depends_on:
      - db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medichub_frontend
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - app-network
      - korex_space_korex_network  # Připojení do KOREX nginx sítě
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
  korex_space_korex_network:
    external: true  # Externí síť z KOREX_Space
